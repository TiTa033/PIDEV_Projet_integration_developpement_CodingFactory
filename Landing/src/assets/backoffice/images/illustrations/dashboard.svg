<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Dashboard Elements -->
  <g transform="translate(50, 50)">
    <!-- Computer Screen -->
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    
    <!-- Screen Content -->
    <rect x="20" y="20" width="260" height="160" rx="5" fill="#f5f5f5"/>
    
    <!-- Graph Lines -->
    <polyline points="40,140 80,100 120,120 160,80 200,100 240,60" 
              fill="none" stroke="#4CAF50" stroke-width="3"/>
    
    <!-- Data Points -->
    <circle cx="40" cy="140" r="4" fill="#4CAF50"/>
    <circle cx="80" cy="100" r="4" fill="#4CAF50"/>
    <circle cx="120" cy="120" r="4" fill="#4CAF50"/>
    <circle cx="160" cy="80" r="4" fill="#4CAF50"/>
    <circle cx="200" cy="100" r="4" fill="#4CAF50"/>
    <circle cx="240" cy="60" r="4" fill="#4CAF50"/>
    
    <!-- Stats Cards -->
    <rect x="40" y="40" width="60" height="40" rx="5" fill="#2196F3" opacity="0.8"/>
    <rect x="120" y="40" width="60" height="40" rx="5" fill="#FFC107" opacity="0.8"/>
    <rect x="200" y="40" width="60" height="40" rx="5" fill="#E91E63" opacity="0.8"/>
  </g>
</svg> 