<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Payment Elements -->
  <g transform="translate(50, 50)">
    <!-- Credit Card -->
    <rect x="0" y="0" width="300" height="180" rx="15" fill="#2196F3"/>
    
    <!-- Card Details -->
    <rect x="20" y="20" width="260" height="30" rx="5" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="70" width="200" height="20" rx="5" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="110" width="100" height="20" rx="5" fill="#ffffff" opacity="0.2"/>
    <rect x="140" y="110" width="60" height="20" rx="5" fill="#ffffff" opacity="0.2"/>
    
    <!-- Payment Icons -->
    <circle cx="250" cy="120" r="25" fill="#FFC107"/>
    <text x="250" y="125" font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">$</text>
    
    <!-- Transaction Lines -->
    <line x1="20" y1="150" x2="280" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="170" x2="280" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
</svg> 