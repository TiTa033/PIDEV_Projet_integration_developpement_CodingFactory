<div class="container mt-5">
    <div class="card shadow p-4 rounded-4">
      <h2 class="text-center mb-4 text-primary">let's generate Student ID Card</h2>
      <form [formGroup]="idCardForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input id="name" formControlName="name" type="text" class="form-control" placeholder="Enter your full name" required />
        </div>
  
        <div class="mb-3">
          <label for="specialty" class="form-label">Specialty</label>
          <input id="specialty" formControlName="specialty" type="text" class="form-control" placeholder="Enter your specialty" required />
        </div>
  
        <div class="mb-4">
          <label for="image" class="form-label">Upload Photo</label>
          <input id="image" type="file" class="form-control" (change)="onImageChange($event)" required />
        </div>
  
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg rounded-pill" [disabled]="idCardForm.invalid">
            <i class="bi bi-card-image me-2"></i> Generate ID Card
          </button>
        </div>
      </form>
    </div>
  </div>
