<section class="section" id="about">
  <div class="container">
    <!-- ✅ Titre amélioré -->
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h2 class="fw-bold text-gradient">🚀 Our Internship Opportunities</h2>
        <p class="text-muted mt-2">
          Explore the latest internship opportunities and start your journey to success! ✨
        </p>
      </div>
    </div>

    <!-- ✅ Liste des stages -->
    <div class="row">
      <div *ngFor="let stage of stages" class="col-lg-4 col-md-6">
        <div class="card blog-box shadow-lg p-4 rounded-4 animate-card">

          <!-- ✅ En-tête avec entreprise et date -->
          <div class="author d-flex justify-content-between align-items-center">
            <h6 class="company-name">
              <i class="mdi mdi-domain fs-17 text-primary"></i> {{ stage.nomEntreprise }}
            </h6>
            <span class="stage-date">
                            <i class="mdi mdi-calendar-month-outline fs-17"></i>
              {{ stage.dateDebut | date:'dd MMM yyyy' }}
                        </span>
          </div>

          <!-- ✅ Corps de la carte -->
          <div class="mt-3">
            <h5 class="fw-semibold text-dark">{{ stage.sujet }}</h5>
            <p class="text-muted small">
              <strong>📌 Status:</strong> {{ stage.statut }} <br>
              <strong>💼 Type:</strong> {{ stage.typeStage }}
            </p>
          </div>

          <!-- ✅ Pied de carte avec bouton stylisé -->
          <div class="text-center mt-4">
            <a [routerLink]="['/blog-details', stage.id]" class="btn-custom">🔍 More Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ✅ CSS amélioré -->
<style>
  /* 🌟 Animation d'entrée pour un effet dynamique */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ✅ Effet de gradient pour le titre */
  .text-gradient {
    background: linear-gradient(to right, #007bff, #6610f2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 2rem;
  }

  /* ✅ Style général des cartes */
  .card {
    background: #ffffff;
    border-radius: 12px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: fadeInUp 0.6s ease-out;
  }

  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.15);
  }

  /* ✅ Effet moderne sur la date */
  .stage-date {
    background: rgba(0, 123, 255, 0.1);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: bold;
    color: #007bff;
  }

  /* ✅ Style du bouton personnalisé */
  .btn-custom {
    display: inline-block;
    background: linear-gradient(135deg, #007bff, #6610f2);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s ease;
  }

  .btn-custom:hover {
    background: linear-gradient(135deg, #0056b3, #520dc2);
    box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
  }

  /* ✅ Entreprise en gras */
  .company-name {
    font-weight: 600;
    color: #343a40;
  }

  /* ✅ Petits ajustements pour un design propre */
  .text-muted {
    font-size: 0.9rem;
  }
</style>
