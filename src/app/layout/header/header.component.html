
<!--start page Loader -->
<div id="preloader">
    <div id="status">
        <div class="load">
            <hr />
            <hr />
            <hr />
            <hr />
        </div>
    </div>
</div>
<!--end page Loader -->

 <!-- START NAVBAR -->
 <nav  id="navbar" class="navbar navbar-expand-lg fixed-top sticky" (window:scroll)="windoscroll()">
    <div class="container" >
        <a class="navbar-brand" href="/"><img src="assets/images/logo-dark.png" alt="" height="23"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" (click)="toggleMenu()" aria-label="Toggle navigation">
            <i class="mdi mdi-menu text-muted"></i>
        </button>
        <div class="collapse navbar-collapse" scrollSpy id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="navbar-navList">
                <li class="nav-item">
                    <a [ngxScrollTo]="'#home'" class="nav-link" [ngClass]="{'active':curentsection === 'home'}" href="javascript:void(0);">Home</a>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#features'" class="nav-link" [ngClass]="{'active':curentsection === 'features'}" href="javascript:void(0);">Resources</a>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#client'" class="nav-link" [ngClass]="{'active':curentsection === 'client'}" href="javascript:void(0);">EVENTS</a>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#price'" class="nav-link" [ngClass]="{'active':curentsection === 'price'}" href="javascript:void(0);">Pricing</a>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#faq'" class="nav-link" [ngClass]="{'active':curentsection === 'faq'}" href="javascript:void(0);">Faq</a>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#about'" class="nav-link" [ngClass]="{'active':curentsection === 'about'}" href="javascript:void(0);">About</a>
                </li>
                <li dropdown class="nav-item dropdown">
                    <a class="nav-link" [ngClass]="{'active':curentsection === 'blog'}" id="navbarDropdown" role="button" dropdownToggle aria-expanded="false">
                        Blog <i class="mdi mdi-chevron-down"></i>
                    </a>
                    <ul *dropdownMenu class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="nav-link" [ngxScrollTo]="'#blog'" [ngClass]="{'active':curentsection === 'blog'}" routerLink="/">Blog</a></li>
                        <li><a class="nav-link" routerLink="/blog-list" href="javascript:void(0);">Blog List</a></li>
                        <li><a class="nav-link" routerLink="/blog-details"href="javascript:void(0);">Blog Details</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a [ngxScrollTo]="'#contact'" class="nav-link" [ngClass]="{'active':curentsection === 'contact'}" href="javascript:void(0);">Contact</a>
                </li>
            </ul>
            <!--end navbar-nav-->
            <ul class="list-inline mb-0 ps-lg-4 ms-2">
                <li class="list-inline-item">
                    <a href="javascript: void(0);" class="primary-link"><i class="mdi mdi-facebook me-1"></i></a>
                </li>
                <li class="list-inline-item">
                    <a href="javascript: void(0);" class="primary-link"><i class="mdi mdi-twitter me-1"></i></a>
                </li>
                <li class="list-inline-item">
                    <a href="javascript: void(0);" class="primary-link"><i class="mdi mdi-instagram"></i></a>
                </li>
            </ul>

          <div *ngIf="isAuthenticated()" class="d-flex align-items-center ms-3">
            <!-- ✅ Display Profile Image -->
            <img *ngIf="profileImage" [src]="'http://localhost:8082/uploads/' + profileImage"
                 alt="Profile" class="rounded-circle me-2" width="40" height="40">

            <!-- ✅ Display Username -->
            <span class="me-2 text-primary"><i class="mdi mdi-account"></i> {{ username }}</span>

            <!-- ✅ Profile Button -->
            <button [routerLink]="['/profile']" type="button" class="btn btn-outline-primary">
              <i class="mdi mdi-account-circle"></i> Profile
            </button>
          </div>

          <!-- Auth Buttons -->
          <div class="ms-3">
            <button *ngIf="isAuthenticated()" class="btn btn-danger" (click)="logout()">Logout</button>
            <button *ngIf="!isAuthenticated()" class="btn btn-primary" [routerLink]="['/login']">Login</button>
          </div>
        </div>
        <!--end collapse-->
    </div>
    <!--end container-->
</nav>
<!-- END NAVBAR -->
