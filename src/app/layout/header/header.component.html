<!--start page Loader -->
<div id="preloader">
  <div id="status">
    <div class="load">
      <hr />
      <hr />
      <hr />
      <hr />
    </div>
  </div>
</div>
<!--end page Loader -->

<!-- START NAVBAR -->
<nav id="navbar" class="navbar navbar-expand-lg fixed-top sticky" (window:scroll)="windoscroll()">
  <div class="container" style="transform: translateX(-100px);">
    <a class="navbar-brand" href="/"><img src="assets/images/logo-dark.png" alt="" height="123"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            (click)="toggleMenu()" aria-label="Toggle navigation">
      <i class="mdi mdi-menu text-muted"></i>
    </button>
    <div class="collapse navbar-collapse" scrollSpy id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="navbar-navList">
        <li class="nav-item">
          <a [ngxScrollTo]="'#home'" class="nav-link" [ngClass]="{'active':curentsection === 'home'}"
             href="javascript:void(0);">Home</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#features'" class="nav-link" [ngClass]="{'active':curentsection === 'features'}"
             href="javascript:void(0);">Resources</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#client'" class="nav-link" [ngClass]="{'active':curentsection === 'client'}"
             href="javascript:void(0);">Events</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#eval'" class="nav-link" [ngClass]="{'active':curentsection === 'eval'}"
             href="javascript:void(0);">Evaluation</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#price'" class="nav-link" [ngClass]="{'active':curentsection === 'price'}"
             href="javascript:void(0);">Pricing</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#certif'" class="nav-link" [ngClass]="{'active':curentsection === 'eval'}"
             href="javascript:void(0);">Certification</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#courses'" class="nav-link" [ngClass]="{'active':curentsection === 'courses'}"
             href="javascript:void(0);">Courses</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#freelance'" class="nav-link" [ngClass]="{'active':curentsection === 'freelance'}"
             href="javascript:void(0);">Freelance</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#about'" class="nav-link" [ngClass]="{'active':curentsection === 'about'}"
             href="javascript:void(0);">Internships</a>
        </li>
        <li class="nav-item">
          <a [ngxScrollTo]="'#blog'" class="nav-link" [ngClass]="{'active':curentsection === 'blog'}"
             href="javascript:void(0);">blog</a>
        </li>



        <li class="nav-item">
          <a [ngxScrollTo]="'#contact'" class="nav-link" [ngClass]="{'active':curentsection === 'contact'}"
             href="javascript:void(0);">Admission</a>
        </li>
      </ul>

      <!-- User profile -->
      <div *ngIf="isAuthenticated()" class="d-flex align-items-center ms-3">
        <img *ngIf="profileImage" [src]="'http://localhost:8082/uploads/' + profileImage" alt="Profile"
             class="rounded-circle me-2" width="40" height="40">

        <a [routerLink]="['/profile']" class="username-link me-2 d-flex align-items-center text-decoration-none">
          <i class="mdi mdi-account me-1"></i>
          <span class="username-text">{{ username }}</span>
        </a>

      </div>


      <!-- Auth Buttons -->
      <div class="ms-3 d-flex align-items-center">
        <!-- Logout Button with Icon -->
        <button *ngIf="isAuthenticated()" class="btn btn-outline-danger rounded-circle shadow-sm d-flex align-items-center justify-content-center position-relative logout-icon"
                (click)="logout()" style="width: 42px; height: 42px;">
          <i class="mdi mdi-logout fs-5"></i>
        </button>

        <!-- Login Button with Tooltip -->
        <div class="ms-3 d-flex align-items-center position-relative">
          <a *ngIf="!isAuthenticated()" [routerLink]="['/login']"
             class="btn btn-outline-primary rounded-circle shadow-sm d-flex align-items-center justify-content-center position-relative login-icon"
             style="width: 42px; height: 42px;">
            <i class="mdi mdi-account-key fs-5"></i>

            <!-- Tooltip Text -->
            <span class="login-tooltip">Log in</span>
          </a>
        </div>
      </div>



    </div>
  </div>
</nav>
<!-- END NAVBAR -->
