<div class="authentication-bg min-vh-100">
  <div class="container">
    <div class="d-flex flex-column min-vh-100 px-3 pt-4">
      <div class="row justify-content-center my-auto">
        <div class="col-md-8 col-lg-6 col-xl-4">
          <div class="py-5">
            <div class="text-center">
              <div class="mb-4 pb-4">
                <a routerLink="/" class="d-block auth-logo">
                  <div class="logo-background">
                    <img src="assets/images/logo-light.png" alt="" class="larger-logo">
                  </div>
                </a>
              </div>


              <div class="mb-4 pb-2">
                <h5 class="text-white">Welcome Back!</h5>
                <p class="text-white-50 mb-0">Login to continue with CodingFacotry</p>
              </div>
            </div>

            <!-- Display error message -->
            <div *ngIf="errorMessage" class="alert alert-danger text-center">
              {{ errorMessage }}
            </div>

            <!-- Updated form with ngModel -->
            <form class="auth-form text-white" (ngSubmit)="login()">
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email"
                       [(ngModel)]="credentials.email" name="email"
                       placeholder="Email" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password"
                       [(ngModel)]="credentials.password" name="password"
                       placeholder="Password" required>
              </div>
              <div class="mb-4">
                <a routerLink="/reset-password" class="float-end text-white-50">Forgot Password?</a>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                  <label class="form-check-label" for="flexCheckDefault">Remember Me</label>
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" class="btn btn-primary w-100">Login Now</button>
              </div>
            </form>

            <div class="mt-5 text-center text-white-50">
              <p>Don't have an account?
                <a routerLink="/register" class="fw-medium text-white text-decoration-underline"> Register </a>
              </p>
            </div>
          </div>
        </div>
      </div>


    </div>
  </div>
</div>
