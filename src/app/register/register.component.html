<div class="authentication-bg min-vh-100">
    <div class="container">
        <div class="d-flex flex-column min-vh-100 px-3 pt-4">
            <div class="row justify-content-center my-auto">
                <div class="col-md-8 col-lg-6 col-xl-4">
                    <div class="py-5">
                        <div class="text-center">
                            <div class="mb-4 pb-4">
                                <a routerLink="/" class="d-block auth-logo">
                                    <img src="assets/images/logo-light.png" alt="" height="23">
                                </a>
                            </div>
                            <div class="mb-4 pb-2">
                                <h5 class="text-white">Register Account</h5>
                                <p class="text-white-50 mb-0">Register for a new account with Landsay</p>
                            </div>
                        </div>

                        <!-- Display error message -->
                        <div *ngIf="errorMessage" class="alert alert-danger text-center">
                            {{ errorMessage }}
                        </div>

                        <!-- Updated form with ngModel -->
                        <form class="auth-form text-white" (ngSubmit)="register()">
                            <div class="mb-3">
                                <label for="firstname" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstname"
                                    [(ngModel)]="user.firstname" name="firstname"
                                    placeholder="First Name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" class="form-control" id="email"
                                    [(ngModel)]="user.email" name="email"
                                    placeholder="Enter Email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="userpassword">Password</label>
                                <input type="password" class="form-control" id="userpassword"
                                    [(ngModel)]="user.password" name="password"
                                    placeholder="Enter password" required>
                            </div>
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                                    <label class="form-check-label" for="flexCheckDefault">
                                        I agree to the <a href="javascript: void(0);" class="text-white text-decoration-underline">Terms and conditions</a>
                                    </label>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary w-100">Register Now</button>
                            </div>
                        </form>

                        <div class="mt-5 text-center text-white-50">
                            <p>Already a member? 
                                <a routerLink="/login" class="fw-medium text-white text-decoration-underline"> Login </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-12">
                <div class="text-center text-white-50 p-4">
                    <p class="mb-0">{{ year }} © Landsay - Designed with <i class="mdi mdi-heart text-danger"></i> by 
                        <a href="https://themeforest.net/search/themesdesign" class="text-muted">Themesdesign.</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
