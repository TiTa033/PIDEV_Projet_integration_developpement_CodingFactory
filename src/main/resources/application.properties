spring.application.name=GestionEvent
spring.datasource.url=jdbc:mysql://localhost:3306/eventdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8083
spring.web.cors.allowed-origins=http://localhost:4200
#server.servlet.context-path=/event
# Désactivation du vérificateur de compatibilité Spring Cloud (optionnel mais utile)
spring.cloud.compatibility-verifier.enabled=false

# Enregistrement Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true   
server.servlet.context-path=/event
user.service.url=http://localhost:8082




# Import de configuration (désactivation du config server obligatoire pour Spring Boot 3+)
spring.config.import=optional:configserver:
# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
